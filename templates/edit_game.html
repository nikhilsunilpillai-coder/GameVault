{% extends "base.html" %}
{% block title %}GameVault | Edit {{ game.name }}{% endblock %}
{% block content %}
<section class="form-page">
<p class="eyebrow">CATALOGUE MANAGEMENT</p><h1>Edit Game</h1><p class="muted">Update the selected record and its related database entries.</p>
<form method="post" class="project-form">
<label>Game Name<input name="name" value="{{ game.name }}" required></label>
<label>Developer<input name="developer" value="{{ game.developer }}" required></label>
<label>Publisher<input name="publisher" value="{{ game.publisher }}" required></label>
<label>Release Date<input type="date" name="release_date" value="{{ game.release_date }}" required></label>
<label>Genre<input name="genre" value="{{ game.genre }}" required></label>
<label>Age Rating<input name="age_rating" value="{{ game.age_rating }}" required></label>
<label>Rating<input type="number" name="rating" min="0" max="5" step="0.1" value="{{ game.rating }}" required></label>
<label>Platforms<input name="platforms" value="{{ platform_text }}" placeholder="PC, PlayStation 5, Xbox Series X|S"></label>
<label>Languages<input name="languages" value="{{ language_text }}" placeholder="English, Japanese, French"></label>
<label>Tags / Categories<input name="tags" value="{{ game.tags }}" placeholder="Action, RPG, Open World, Multiplayer"></label>
<label>Image URL<input name="image_url" value="{{ game.image_url or '' }}" placeholder="https://..."></label>
<label>Store Links <small>One per line: Store | URL | Platform</small><textarea name="stores">{{ store_text }}</textarea></label>
<label>Regional Prices <small>One per line: Country | Free/Paid | Amount</small><textarea name="prices">{{ price_text }}</textarea></label>
<label>Summary<textarea name="summary" required>{{ game.summary }}</textarea></label>
<label>How It Works<textarea name="how_it_works" required>{{ game.how_it_works }}</textarea></label>
<div class="form-actions"><button class="btn" type="submit">Update Game</button><a class="back" href="{{ url_for('admin') }}">Cancel</a></div>
</form></section>
{% endblock %}
