{% extends "base.html" %}
{% block title %}GameVault | {{ ui.edit_game_title }} — {{ game.name }}{% endblock %}
{% block content %}<section class="form-page"><p class="eyebrow">{{ ui.catalogue_management }}</p><h1>{{ ui.edit_game_title }}</h1><p class="muted">{{ ui.edit_game_help }}</p>
<form method="post" class="project-form">
<label>{{ ui.game_name }}<input name="name" value="{{ game.name }}" required></label>
<label>{{ ui.developer }}<input name="developer" value="{{ game.developer }}" required></label>
<label>{{ ui.publisher }}<input name="publisher" value="{{ game.publisher }}" required></label>
<label>{{ ui.release }}<input type="date" name="release_date" value="{{ game.release_date }}" required></label>
<label>{{ ui.genre }}<input name="genre" value="{{ game.genre }}" required></label>
<label>{{ ui.age_rating }}<input name="age_rating" value="{{ game.age_rating }}" required></label>
<label>{{ ui.rating }}<input type="number" name="rating" min="0" max="5" step="0.1" value="{{ game.rating }}" required></label>
<label>{{ ui.platforms }}<input name="platforms" value="{{ platform_text }}" placeholder="PC, PlayStation 5, Xbox Series X|S"></label>
<label>{{ ui.languages }}<input name="languages" value="{{ language_text }}" placeholder="English, Japanese, French"></label>
<label>{{ ui.tags_categories }}<input name="tags" value="{{ game.tags }}" placeholder="Action, RPG, Open World, Multiplayer"></label>
<label>{{ ui.image_url }}<input name="image_url" value="{{ game.image_url or '' }}" placeholder="https://..."></label>
<label>{{ ui.store_links }} <small>{{ ui.store_format }}</small><textarea name="stores">{{ store_text }}</textarea></label>
<label>{{ ui.regional_prices }} <small>{{ ui.price_format }}</small><textarea name="prices">{{ price_text }}</textarea></label>
<label>{{ ui.summary }}<textarea name="summary" required>{{ game.summary }}</textarea></label>
<label>{{ ui.how_it_works }}<textarea name="how_it_works" required>{{ game.how_it_works }}</textarea></label>
<div class="form-actions"><button class="btn" type="submit">{{ ui.update_game }}</button><a class="back" href="{{ url_for('admin') }}">{{ ui.cancel }}</a></div>
</form></section>{% endblock %}
