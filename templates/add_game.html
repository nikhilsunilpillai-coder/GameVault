{% extends "base.html" %}
{% block title %}GameVault | {{ ui.add_game_title }}{% endblock %}
{% block content %}<section class="form-page"><p class="eyebrow">{{ ui.catalogue_management }}</p><h1>{{ ui.add_game_title }}</h1><p class="muted">{{ ui.add_game_help }}</p>
<form method="post" class="project-form">
<label>{{ ui.game_name }}<input name="name" required autofocus></label>
<label>{{ ui.developer }}<input name="developer" required></label>
<label>{{ ui.publisher }}<input name="publisher" required></label>
<label>{{ ui.release }}<input type="date" name="release_date" required></label>
<label>{{ ui.genre }}<input name="genre" required placeholder="Action, RPG, Simulation..."></label>
<label>{{ ui.age_rating }}<input name="age_rating" required placeholder="E10+, T, M..."></label>
<label>{{ ui.rating }}<input type="number" name="rating" min="0" max="5" step="0.1" required></label>
<label>{{ ui.platforms }}<input name="platforms" placeholder="PC, PlayStation 5, Xbox Series X|S"></label>
<label>{{ ui.languages }}<input name="languages" placeholder="English, Japanese, French"></label>
<label>{{ ui.tags_categories }}<input name="tags" placeholder="Action, RPG, Open World, Multiplayer"></label>
<label>{{ ui.image_url }}<input name="image_url" placeholder="https://..."></label>
<label>{{ ui.store_links }} <small>{{ ui.store_format }}</small><textarea name="stores" placeholder="Steam | https://store.steampowered.com/ | PC"></textarea></label>
<label>{{ ui.regional_prices }} <small>{{ ui.price_format }}</small><textarea name="prices" placeholder="India | Paid | 1999&#10;United States | Paid | 59.99"></textarea></label>
<label>{{ ui.summary }}<textarea name="summary" required></textarea></label>
<label>{{ ui.how_it_works }}<textarea name="how_it_works" required></textarea></label>
<button class="btn" type="submit">{{ ui.save_game }}</button><a class="back" href="{{ url_for('admin') }}">← {{ ui.back_dashboard }}</a>
</form></section>{% endblock %}
